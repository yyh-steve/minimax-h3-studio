[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-local-api"
version = "0.1.1"
description = "Single-image Ref2VA subset of the MiniMax H3 V2 API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
h3-local-api = "h3_api.__main__:main"

[tool.setuptools.packages.find]
include = ["h3_api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
